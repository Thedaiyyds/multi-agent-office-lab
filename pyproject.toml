[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "multi-agent-office-lab"
version = "2.4.1"
description = "A reproducible multi-agent office collaboration course project"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langgraph>=1,<2",
    "markdown-it-py>=3,<5",
    "pydantic>=2.10,<3",
    "python-docx>=1.2,<2",
    "python-dotenv>=1,<2",
    "python-multipart>=0.0.20,<1",
    "reportlab>=4.4,<5",
    "streamlit>=1.65,<2",
    "uvicorn>=0.34,<1",
]

[project.scripts]
office-agents = "office_agents.cli:main"
office-workbench = "office_agents.workbench.__main__:main"

[dependency-groups]
dev = ["pypdf>=6,<7", "pytest>=8,<10", "ruff>=0.11,<1"]
report = ["python-docx>=1.2,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/office_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
